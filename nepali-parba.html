<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nepali Parba — Festival Tracker</title>
<style>
:root{
  --bg:#fdf6ee; --card:#ffffff; --ink:#2b1c12; --sub:#7a6a58;
  --accent:#c0392b; --accent2:#e08e2b; --line:#eee0cf;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c140d; --card:#241a11; --ink:#f3e9db; --sub:#b9a88f;
    --accent:#e5675a; --accent2:#f0a94a; --line:#3a2c1c;
  }
}
:root[data-theme="dark"]{
  --bg:#1c140d; --card:#241a11; --ink:#f3e9db; --sub:#b9a88f;
  --accent:#e5675a; --accent2:#f0a94a; --line:#3a2c1c;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:'Georgia',ui-serif,serif; -webkit-font-smoothing:antialiased;
}
header{
  padding:28px 20px 18px; text-align:center;
  border-bottom:1px solid var(--line);
}
header h1{margin:0 0 4px; font-size:1.6rem; letter-spacing:.3px;}
header p{margin:0; color:var(--sub); font-size:.9rem;}
.tabs{display:flex; justify-content:center; gap:8px; margin:16px auto 0; max-width:420px;}
.tab{
  flex:1; padding:8px 10px; text-align:center; border-radius:999px;
  border:1px solid var(--line); font-size:.82rem; cursor:pointer; color:var(--sub);
  background:var(--card);
}
.tab.active{background:var(--accent); color:#fff; border-color:var(--accent);}
main{max-width:640px; margin:0 auto; padding:20px 16px 40px;}
.next{
  background:linear-gradient(135deg, var(--accent), var(--accent2));
  color:#fff; border-radius:16px; padding:20px; margin-bottom:22px;
  text-align:center;
}
.next .label{font-size:.75rem; text-transform:uppercase; letter-spacing:1.5px; opacity:.9;}
.next .name{font-size:1.5rem; margin:6px 0 2px; font-weight:bold;}
.next .days{font-size:2.2rem; font-weight:bold; margin-top:6px;}
.next .sub{font-size:.85rem; opacity:.9;}
.search{
  width:100%; padding:10px 14px; border-radius:10px; border:1px solid var(--line);
  background:var(--card); color:var(--ink); font-size:.95rem; margin-bottom:16px;
}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:14px 16px; margin-bottom:10px; display:flex; justify-content:space-between; gap:10px; align-items:center;
}
.card.past{opacity:.5;}
.card .info h3{margin:0 0 3px; font-size:1.02rem;}
.card .info .meta{font-size:.8rem; color:var(--sub);}
.card .info .desc{font-size:.82rem; color:var(--sub); margin-top:4px; max-width:400px;}
.card .badge{
  min-width:52px; text-align:center; font-size:.75rem; color:var(--sub);
  border-left:1px solid var(--line); padding-left:10px; flex-shrink:0;
}
.card .badge b{display:block; font-size:1.1rem; color:var(--accent);}
footer{text-align:center; color:var(--sub); font-size:.75rem; padding:10px 20px 30px;}
</style>
</head>
<body>
<header>
  <h1>🪔 Nepali Parba</h1>
  <p>Festival calendar for 2083 BS (2026 AD) — for Nepal &amp; the diaspora</p>
  <div class="tabs">
    <div class="tab active" data-f="all">All festivals</div>
    <div class="tab" data-f="major">Major only</div>
  </div>
</header>
<main>
  <div class="next" id="nextCard"></div>
  <input class="search" id="search" placeholder="Search a festival (e.g. Tihar, Teej)...">
  <div id="list"></div>
</main>
<footer>Dates follow the lunar/solar Nepali calendar and can shift slightly by region or official notice — always confirm major ritual timings (sait) closer to the date.</footer>

<script>
// 2083 BS (2026 AD) — dates from Nepal govt gazette, embassy notices & panchang sources
const festivals = [
  {name:"Maghe Sankranti", date:"2026-01-14", major:true, desc:"Winter solstice festival; Tharu New Year (Maghi); ritual baths and sesame/chaku sweets."},
  {name:"Basant Panchami", date:"2026-01-22", major:false, desc:"Worship of Saraswati, goddess of learning."},
  {name:"Losar (Tibetan/Sherpa New Year)", date:"2026-02-18", major:false, desc:"New year for Tibetan, Sherpa & Tamang communities, big celebrations at Boudhanath."},
  {name:"Maha Shivaratri", date:"2026-02-15", major:true, desc:"Shiva's night — huge gathering at Pashupatinath Temple."},
  {name:"Holi (Fagu Purnima)", date:"2026-03-03", major:true, desc:"Festival of colors, celebrated a day earlier in the hills than in the Terai."},
  {name:"Nepali New Year 2083", date:"2026-04-14", major:true, desc:"Baisakh 1 — start of the new Bikram Sambat year; Bisket Jatra in Bhaktapur."},
  {name:"Buddha Jayanti", date:"2026-05-31", major:true, desc:"Birth, enlightenment & nirvana of Buddha, celebrated widely at Lumbini & Boudhanath."},
  {name:"Janai Purnima", date:"2026-08-28", major:false, desc:"Sacred thread changing ceremony for Hindu men; Rakshya Bandhan."},
  {name:"Gai Jatra", date:"2026-08-29", major:false, desc:"Cow festival / procession honoring those who died in the past year, especially in Kathmandu Valley."},
  {name:"Haritalika Teej", date:"2026-09-14", major:true, desc:"Married & unmarried women fast and pray for marital happiness; big gatherings, red saris."},
  {name:"Indra Jatra", date:"2026-09-25", major:false, desc:"Chariot procession of the Living Goddess Kumari, celebrated in Kathmandu Valley."},
  {name:"Ghatasthapana", date:"2026-10-11", major:true, desc:"Dashain begins — jamara seeds sown."},
  {name:"Phulpati", date:"2026-10-17", major:false, desc:"Sacred flowers & plants brought in procession, 7th day of Dashain."},
  {name:"Maha Ashtami", date:"2026-10-18", major:false, desc:"Worship of goddess Durga, 8th day of Dashain."},
  {name:"Maha Navami", date:"2026-10-20", major:false, desc:"Ninth-day rituals, 9th day of Dashain."},
  {name:"Vijaya Dashami (Big Tika)", date:"2026-10-21", major:true, desc:"Main Dashain day — elders give tika & jamara to the young; auspicious time ~11:53 AM NPT."},
  {name:"Kojagrat Purnima", date:"2026-10-25", major:false, desc:"Full-moon night that closes the Dashain festival."},
  {name:"Kaag Tihar", date:"2026-11-07", major:false, desc:"Tihar begins — crows worshipped as messengers of death."},
  {name:"Kukur Tihar", date:"2026-11-08", major:false, desc:"Dogs honored and garlanded for their loyalty."},
  {name:"Laxmi Puja / Gai Tihar", date:"2026-11-09", major:true, desc:"Goddess of wealth worshipped; homes lit with diyas, cows honored."},
  {name:"Govardhan Puja / Mha Puja", name2:"", date:"2026-11-10", major:false, desc:"Newar New Year (Nepal Sambat) and self-worship ritual."},
  {name:"Bhai Tika", date:"2026-11-11", major:true, desc:"Final day of Tihar — sisters apply tika to brothers for long life, closes the festival."},
  {name:"Chhath Parba", date:"2026-11-15", major:true, desc:"Worship of the Sun god, especially significant for the Madhesi & Mithila community."},
  {name:"Yomari Punhi", date:"2026-12-24", major:false, desc:"Newar harvest festival — steamed rice-flour sweets (yomari) offered."},
  {name:"Christmas", date:"2026-12-25", major:false, desc:"Celebrated nationally as a public holiday alongside the Christian community."}
];

const listEl = document.getElementById('list');
const nextEl = document.getElementById('nextCard');
const searchEl = document.getElementById('search');
let filterMode = 'all';

function daysUntil(dstr){
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dstr+"T00:00:00");
  return Math.round((d - today) / 86400000);
}

function render(){
  const q = searchEl.value.trim().toLowerCase();
  listEl.innerHTML = '';
  const sorted = [...festivals].sort((a,b)=> new Date(a.date) - new Date(b.date));
  const upcoming = sorted.filter(f => daysUntil(f.date) >= 0);
  const nextFest = upcoming.find(f => filterMode === 'all' || f.major) || upcoming[0];

  if(nextFest){
    const d = daysUntil(nextFest.date);
    nextEl.innerHTML = `<div class="label">Next up</div>
      <div class="name">${nextFest.name}</div>
      <div class="days">${d===0 ? "Today!" : d+" day"+(d===1?"":"s")}</div>
      <div class="sub">${new Date(nextFest.date+"T00:00:00").toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric', year:'numeric'})}</div>`;
  } else {
    nextEl.innerHTML = `<div class="label">2083 BS calendar</div><div class="name">All festivals have passed</div>`;
  }

  sorted.forEach(f=>{
    if(filterMode === 'major' && !f.major) return;
    if(q && !f.name.toLowerCase().includes(q)) return;
    const d = daysUntil(f.date);
    const past = d < 0;
    const card = document.createElement('div');
    card.className = 'card' + (past ? ' past' : '');
    card.innerHTML = `
      <div class="info">
        <h3>${f.name}${f.major ? ' ⭐' : ''}</h3>
        <div class="meta">${new Date(f.date+"T00:00:00").toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric', year:'numeric'})}</div>
        <div class="desc">${f.desc}</div>
      </div>
      <div class="badge">${past ? 'Past' : (d===0 ? '<b>Today</b>' : `<b>${d}</b>day${d===1?'':'s'}`)}</div>`;
    listEl.appendChild(card);
  });
}

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    filterMode = t.dataset.f;
    render();
  });
});
searchEl.addEventListener('input', render);
render();
</script>
</body>
</html>
